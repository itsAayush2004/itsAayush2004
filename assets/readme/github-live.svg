<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="Live GitHub stats">
<title>Live GitHub stats</title>
<style>
.s{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
</style>
<rect width="880" height="150" rx="16" fill="#16161A"/>
<circle cx="32" cy="30" r="4" fill="#39D353"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="44" y="35" class="m" font-size="11" fill="#86837D" font-weight="500" text-anchor="start" letter-spacing="1.5">LIVE FROM GITHUB · waiting for the first daily sync</text>
<text x="28" y="98" class="s" font-size="18" fill="#B4B0A9" font-weight="400" text-anchor="start" >Numbers appear after the readme-live workflow runs.</text>
</svg>
